name: Atualizar obras federais do Ceará

on:
  schedule:
    - cron: "37 6 * * *"     # todo dia de madrugada (horário de Brasília): lista e detalhes do ObrasGov
    - cron: "41 8 * * 0"     # domingo: também IBGE e IPCA
  workflow_dispatch:
    inputs:
      semanal:
        description: "Também IBGE e IPCA (sim/não)"
        required: false
        default: "não"

permissions:
  contents: write

concurrency:
  group: atualizar-obras-ce
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Testes
        run: python -m pytest -q tests
      - name: Coletar e montar o site
        run: |
          if [ "${{ github.event.inputs.semanal }}" = "sim" ] || [ "${{ github.event.schedule }}" = "41 8 * * 0" ]; then
            python atualizar.py --semanal --minutos-lista 150 --minutos 150
          else
            python atualizar.py --minutos-lista 150 --minutos 150
          fi
      - name: Publicar
        if: always()
        run: |
          git config user.name  "robo-quanto-custa"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p docs/dados dados_brutos
          git add docs/dados dados_brutos
          if ! git diff --cached --quiet; then
            git commit -m "obras ce: dados de $(date -u +%Y-%m-%d)"
            for i in 1 2 3 4 5; do
              git pull --rebase -X ours origin main || true
              if git push; then break; fi
              echo "Envio recusado; nova tentativa em $((i*20)) s"; sleep $((i*20))
              [ $i = 5 ] && exit 1
            done
          fi
